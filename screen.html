<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon.png">
<title>Theatre — Projector</title>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.show-cursor { cursor: default; }
  .layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2vw;
    padding: 2vh 2vw; box-sizing: border-box; opacity: 0; transition: opacity 0.9s ease;
  }
  .layer.visible { opacity: 1; }
  .layer img { max-width: 100%; max-height: 100%; object-fit: contain; min-width: 0; flex: 1 1 0; height: 100%; }
  .layer.single img { flex: 0 1 auto; width: auto; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 3vh; text-align: center; pointer-events: none;
    font-family: "Palatino Linotype", Georgia, serif; font-size: 4.2vh; letter-spacing: 0.06em; color: #f3e6d2;
    text-shadow: 0 2px 8px #000, 0 0 24px #000; opacity: 0; transition: opacity 0.9s ease;
  }
  .caption.visible { opacity: 1; }
  /* With people on stage the place fills the whole screen, so nobody stands on a black border. */
  body.staged .layer { padding: 0; }
  body.staged .layer img { width: 100%; height: 100%; max-width: none; object-fit: cover; flex: 1 1 0; }
  .stage { position: absolute; inset: 0; pointer-events: none; }
  .stage::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45vh; opacity: 0; transition: opacity 0.9s ease;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
  }
  .stage.occupied::before { opacity: 1; }
  .person {
    position: absolute; bottom: 0; height: 88vh; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; transform: translateX(-50%); opacity: 0;
    transition: opacity 0.7s ease, left 0.7s ease;
  }
  .person.visible { opacity: 1; }
  .person img { max-height: 88vh; max-width: 46vw; object-fit: contain; filter: drop-shadow(0 0 1.6vh rgba(0, 0, 0, 0.75)); }
  .nameplate {
    position: absolute; bottom: 4vh; padding: 0.6vh 2.4vh; border: 1px solid rgba(201, 162, 39, 0.7); border-radius: 0.6vh;
    background: rgba(20, 8, 8, 0.82); color: #f3e6d2; white-space: nowrap;
    font-family: "Palatino Linotype", Georgia, serif; font-size: 3.6vh; letter-spacing: 0.06em;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .stage.names .nameplate { opacity: 1; }
  .scene { position: absolute; inset: 0; }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6d5b4c;
    font-family: Georgia, serif; font-size: 2.4vh; text-align: center; line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) { .layer, .caption, .person, .nameplate, .stage::before { transition: none; } }
</style>
</head>
<body>
<div class="hint" id="hint">Drag this window to the projector, then click anywhere for full screen.<br>Pictures you pick in the control window appear here.</div>
<div class="scene" id="scene">
  <div class="layer" id="layer-a"></div>
  <div class="layer" id="layer-b"></div>
  <div class="stage" id="stage"></div>
</div>
<canvas class="fx" id="fx"></canvas>
<div class="caption" id="caption"></div>
<script src="/fx.js"></script>
<script src="/sound.js"></script>
<script src="/relay.js"></script>
<script>
(function () {
  "use strict";

  // Sounds play here when the control window chooses "Play sounds on: projector".
  const sounds = window.TableSound();

  function reportSounds() {
    channel.post({ type: "sound-status", playing: sounds.playingIds() });
  }

  sounds.onChange = reportSounds;

  function handleSound(message) {

    if (message.op === "files") {
      sounds.files = message.files || [];
    } else if (message.op === "toggle") {
      sounds.toggleLoop(message.id);
    } else if (message.op === "play") {
      sounds.play(message.id);
    } else if (message.op === "match") {
      sounds.matchEffects(message.ids || []);
    } else if (message.op === "volume") {
      sounds.setVolume(message.kind, message.value);
    } else if (message.op === "stop") {
      sounds.stopAll();
    }

    reportSounds();
  }

  const channel = window.TableRelay(function (message) {

    if (message.type === "show") {
      showState(message.state);
    }

    if (message.type === "shake") {
      effects.shake(sceneElement);
    }

    if (message.type === "sound") {
      handleSound(message);
    }

    // a control window just opened: tell it the projector is here
    if (message.type === "hello") {
      channel.post({ type: "screen-ready" });
      reportSounds();
    }
  });

  channel.onConnect = function () {
    channel.post({ type: "screen-ready" });
  };
  const layers = [document.getElementById("layer-a"), document.getElementById("layer-b")];
  const caption = document.getElementById("caption");
  const hint = document.getElementById("hint");
  const stage = document.getElementById("stage");
  const effects = window.TableFx(document.getElementById("fx"), {
    onLightning: function (nearness) {
      channel.post({ type: "lightning", nearness: nearness });
    }
  });
  const sceneElement = document.getElementById("scene");
  const SPOTS = { 1: ["50%"], 2: ["27%", "73%"] };
  let activeLayer = 0;
  let cursorTimer = null;

  let shownPictureKey = null;

  function showState(state) {
    hint.hidden = true;
    const images = (state && state.images) || [];
    // Only cross-fade when the picture itself changes, not when people or effects do.
    const pictureKey = JSON.stringify([state && state.campaign, images]);

    if (pictureKey !== shownPictureKey) {
      shownPictureKey = pictureKey;
      swapPicture(state, images);
    }

    effects.set((state && state.fx) || [], state && state.fxLevel, sceneElement);
    const people = (state && state.people) || [];
    showPeople(people, state);
    const showCaption = Boolean(state && state.caption && state.label && images.length && !people.length);
    caption.textContent = showCaption ? state.label : "";
    caption.classList.toggle("visible", showCaption);
  }

  function swapPicture(state, images) {
    const nextLayer = 1 - activeLayer;
    const target = layers[nextLayer];
    target.innerHTML = "";
    target.classList.toggle("single", images.length === 1);

    images.forEach(function (imageName) {
      const image = document.createElement("img");
      image.src = "/img/" + encodeURIComponent(state.campaign || "") + "/" + encodeURIComponent(imageName);
      image.alt = "";
      target.appendChild(image);
    });

    const reveal = function () {
      layers[activeLayer].classList.remove("visible");
      target.classList.add("visible");
      activeLayer = nextLayer;
    };

    const pending = [...target.querySelectorAll("img")].map(function (image) {
      return new Promise(function (resolve) {

        if (image.complete) {
          resolve();
          return;
        }

        image.onload = resolve;
        image.onerror = resolve;
      });
    });

    Promise.all(pending).then(reveal);
  }

  function showPeople(people, state) {
    const spots = SPOTS[people.length] || [];
    const keep = new Set(people.map(function (person) {
      return person.image;
    }));

    [...stage.querySelectorAll(".person")].forEach(function (element) {

      if (!keep.has(element.dataset.image)) {
        element.classList.remove("visible");
        element.dataset.image = "";
        setTimeout(function () {
          element.remove();
        }, 800);
      }
    });

    people.forEach(function (person, index) {
      let element = [...stage.querySelectorAll(".person")].find(function (candidate) {
        return candidate.dataset.image === person.image;
      });

      if (!element) {
        element = document.createElement("div");
        element.className = "person";
        element.dataset.image = person.image;
        element.style.left = spots[index];
        const image = document.createElement("img");
        image.alt = "";
        image.src = "/cutout/" + encodeURIComponent(state.campaign || "") + "/" + encodeURIComponent(person.image);
        const nameplate = document.createElement("div");
        nameplate.className = "nameplate";
        nameplate.textContent = person.name;
        element.appendChild(image);
        element.appendChild(nameplate);
        stage.appendChild(element);
        image.onload = function () {
          element.classList.add("visible");
        };
      }

      element.style.left = spots[index];
    });

    stage.classList.toggle("occupied", people.length > 0);
    document.body.classList.toggle("staged", Boolean(state && state.fill) || people.length > 0 || Boolean(state && state.fx && state.fx.length));
    stage.classList.toggle("names", Boolean(state && state.caption));
  }



  document.addEventListener("click", function () {
    sounds.unlock();

    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });

  document.addEventListener("mousemove", function () {
    document.body.classList.add("show-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () {
      document.body.classList.remove("show-cursor");
    }, 1500);
  });
})();
</script>
</body>
</html>
