<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon.png">
<title>Theatre — Projector</title>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.show-cursor { cursor: default; }
  .layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2vw;
    padding: 2vh 2vw; box-sizing: border-box; opacity: 0; transition: opacity 0.9s ease;
  }
  .layer.visible { opacity: 1; }
  .layer img { max-width: 100%; max-height: 100%; object-fit: contain; min-width: 0; flex: 1 1 0; height: 100%; }
  .layer.single img { flex: 0 1 auto; width: auto; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 3vh; text-align: center; pointer-events: none;
    font-family: "Palatino Linotype", Georgia, serif; font-size: 4.2vh; letter-spacing: 0.06em; color: #f3e6d2;
    text-shadow: 0 2px 8px #000, 0 0 24px #000; opacity: 0; transition: opacity 0.9s ease;
  }
  .caption.visible { opacity: 1; }
  /* With people on stage the place fills the whole screen, so nobody stands on a black border. */
  body.staged .layer { padding: 0; }
  body.staged .layer img { width: 100%; height: 100%; max-width: none; object-fit: cover; flex: 1 1 0; }
  .stage { position: absolute; inset: 0; pointer-events: none; }
  .stage::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45vh; opacity: 0; transition: opacity 0.9s ease;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
  }
  .stage.occupied::before { opacity: 1; }
  .person {
    position: absolute; bottom: 0; height: 88vh; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; transform: translateX(-50%); opacity: 0;
    transition: opacity 0.7s ease, left 0.35s ease, bottom 0.35s ease, height 0.35s ease;
  }
  .person img { transition: transform 0.3s ease; }
  .person.visible { opacity: 1; }
  .person img { max-height: 88vh; max-width: 46vw; object-fit: contain; filter: drop-shadow(0 0 1.6vh rgba(0, 0, 0, 0.75)); }
  .nameplate {
    position: absolute; bottom: calc(4vh + var(--sink, 0vh)); padding: 0.6vh 2.4vh; border: 1px solid rgba(201, 162, 39, 0.7); border-radius: 0.6vh;
    background: rgba(20, 8, 8, 0.82); color: #f3e6d2; white-space: nowrap;
    font-family: "Palatino Linotype", Georgia, serif; font-size: 3.6vh; letter-spacing: 0.06em;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .stage.names .nameplate { opacity: 1; }
  /* isolate: people's stacking stays inside the scene, so a revealed item always sits above them */
  .scene { position: absolute; inset: 0; isolation: isolate; }
  /* An item revealed over the scene: the scene darkens, the item floats in the middle with a soft glow. */
  .reveal { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  .reveal::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.78) 75%); }
  .reveal.visible { opacity: 1; }
  /* the item's spot: the middle unless the DM moved it */
  .reveal .piece {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
    transition: left 0.35s ease, top 0.35s ease;
  }
  .reveal .pop {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: scale(0.82); transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .reveal.visible .pop { transform: scale(1); }
  .reveal .halo {
    position: absolute; left: 50%; top: 50%; width: 78vh; height: 78vh; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 150, 0.3) 0%, rgba(255, 190, 110, 0.12) 38%, rgba(0, 0, 0, 0) 68%);
    animation: halo-pulse 5s ease-in-out infinite;
  }
  .reveal .float { position: relative; animation: item-float 5.5s ease-in-out infinite; }
  .reveal img { display: block; transition: transform 0.3s ease, max-height 0.35s ease, max-width 0.35s ease; }
  .reveal img.cut { filter: drop-shadow(0 0 1.6vh rgba(255, 222, 160, 0.65)) drop-shadow(0 0 6vh rgba(255, 186, 96, 0.35)); }
  /* no cut-out (a letter, a map, a painted card): a sheet with a shadow, so it stays readable */
  .reveal img.sheet { border-radius: 0.5vh; box-shadow: 0 2vh 7vh rgba(0, 0, 0, 0.85), 0 0 4vh rgba(255, 210, 150, 0.18); }
  .reveal.sheet-only .halo { display: none; }
  .reveal.sheet-only .float { animation: none; }
  .reveal .nameplate { position: relative; bottom: auto; margin-top: 3vh; }
  .reveal.names .nameplate { opacity: 1; }
  @keyframes item-float { 0%, 100% { transform: translateY(0.8vh); } 50% { transform: translateY(-1.2vh); } }
  @keyframes halo-pulse { 0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(0.95); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6d5b4c;
    font-family: Georgia, serif; font-size: 2.4vh; text-align: center; line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) {
    .layer, .caption, .person, .nameplate, .stage::before, .reveal, .reveal .piece, .reveal .pop, .reveal img { transition: none; }
    .reveal .float, .reveal .halo { animation: none; }
  }
</style>
</head>
<body>
<div class="hint" id="hint">Drag this window to the projector, then click anywhere for full screen.<br>Pictures you pick in the control window appear here.</div>
<div class="scene" id="scene">
  <div class="layer" id="layer-a"></div>
  <div class="layer" id="layer-b"></div>
  <div class="stage" id="stage"></div>
</div>
<div class="reveal" id="reveal"></div>
<canvas class="fx" id="fx"></canvas>
<div class="caption" id="caption"></div>
<script src="/fx.js"></script>
<script src="/sound.js"></script>
<script src="/relay.js"></script>
<script>
(function () {
  "use strict";

  // Sounds play here when the control window chooses "Play sounds on: projector".
  const sounds = window.TableSound();

  function reportSounds() {
    channel.post({ type: "sound-status", playing: sounds.playingIds() });
  }

  sounds.onChange = reportSounds;

  function handleSound(message) {

    if (message.op === "files") {
      sounds.files = message.files || [];
    } else if (message.op === "toggle") {
      sounds.toggleLoop(message.id);
    } else if (message.op === "play") {
      sounds.play(message.id);
    } else if (message.op === "match") {
      sounds.matchEffects(message.ids || []);
    } else if (message.op === "volume") {
      sounds.setVolume(message.kind, message.value);
    } else if (message.op === "stop") {
      sounds.stopAll();
    }

    reportSounds();
  }

  const channel = window.TableRelay(function (message) {

    if (message.type === "show") {
      showState(message.state);
    }

    if (message.type === "shake") {
      effects.shake(sceneElement);
    }

    if (message.type === "sound") {
      handleSound(message);
    }

    // a control window just opened: tell it the projector is here
    if (message.type === "hello") {
      channel.post({ type: "screen-ready" });
      reportSounds();
    }
  });

  channel.onConnect = function () {
    channel.post({ type: "screen-ready" });
  };
  const layers = [document.getElementById("layer-a"), document.getElementById("layer-b")];
  const caption = document.getElementById("caption");
  const hint = document.getElementById("hint");
  const stage = document.getElementById("stage");
  const effects = window.TableFx(document.getElementById("fx"), {
    onLightning: function (nearness) {
      channel.post({ type: "lightning", nearness: nearness });
    }
  });
  const sceneElement = document.getElementById("scene");
  // Where a person stands: their own spot if the DM moved them, otherwise an even spread.
  const STAGE_SPOTS = { 1: [50], 2: [27, 73], 3: [20, 50, 80], 4: [14, 38, 62, 86] };
  const STAGE_SCALES = { 1: 1, 2: 1, 3: 0.85, 4: 0.75 };

  function placement(person, index, count) {
    const spots = STAGE_SPOTS[count] || STAGE_SPOTS[4];
    return {
      left: person.x !== undefined ? person.x * 100 : spots[Math.min(index, spots.length - 1)],
      bottom: (person.y || 0) * 100,
      scale: person.scale || STAGE_SCALES[count] || 0.75,
      flip: Boolean(person.flip),
    };
  }
  let activeLayer = 0;
  let cursorTimer = null;

  let shownPictureKey = null;

  function showState(state) {
    hint.hidden = true;
    const images = (state && state.images) || [];
    // Only cross-fade when the picture itself changes, not when people or effects do.
    const pictureKey = JSON.stringify([state && state.campaign, images]);

    if (pictureKey !== shownPictureKey) {
      shownPictureKey = pictureKey;
      swapPicture(state, images);
    }

    effects.set((state && state.fx) || [], state && state.fxLevel, sceneElement);
    const people = (state && state.people) || [];
    showPeople(people, state);
    const item = state && state.item && state.item.image ? state.item : null;
    showItem(item, state);
    const showCaption = Boolean(state && state.caption && state.label && images.length && !people.length && !item);
    caption.textContent = showCaption ? state.label : "";
    caption.classList.toggle("visible", showCaption);
  }

  const reveal = document.getElementById("reveal");
  let shownItemKey = "";

  // Where the item floats, how big, flipped and turned: the middle unless the DM moved it.
  function placeItem(item) {
    const piece = reveal.querySelector(".piece");
    const image = reveal.querySelector("img");
    const halo = reveal.querySelector(".halo");

    if (!piece || !image) {
      return;
    }

    const scale = item.scale || 1;
    const sheet = image.classList.contains("sheet");
    piece.style.left = (item.x !== undefined ? item.x * 100 : 50) + "%";
    piece.style.top = (item.y !== undefined ? item.y * 100 : 48) + "%";
    image.style.maxHeight = ((sheet ? 80 : 64) * scale) + "vh";
    image.style.maxWidth = ((sheet ? 80 : 62) * scale) + "vw";
    image.style.transform = "rotate(" + (item.turn || 0) + "deg)" + (item.flip ? " scaleX(-1)" : "");

    if (halo) {
      halo.style.width = (78 * scale) + "vh";
      halo.style.height = (78 * scale) + "vh";
    }
  }

  function showItem(item, state) {
    reveal.classList.toggle("names", Boolean(state && state.caption));

    if (!item) {
      shownItemKey = "";
      reveal.classList.remove("visible");
      return;
    }

    const itemKey = JSON.stringify([state.campaign, item.image, item.cutout]);

    if (itemKey === shownItemKey) {
      const plate = reveal.querySelector(".nameplate");

      if (plate) {
        plate.textContent = item.name || "";
      }

      placeItem(item);
      return;
    }

    shownItemKey = itemKey;
    const build = function () {
      reveal.innerHTML = "";
      reveal.classList.toggle("sheet-only", !item.cutout);
      const piece = document.createElement("div");
      piece.className = "piece";
      const pop = document.createElement("div");
      pop.className = "pop";
      const halo = document.createElement("div");
      halo.className = "halo";
      const float = document.createElement("div");
      float.className = "float";
      const image = document.createElement("img");
      image.alt = "";
      image.className = item.cutout ? "cut" : "sheet";
      const folder = item.cutout ? "/cutout/" : "/img/";
      image.src = folder + encodeURIComponent(state.campaign || "") + "/" + encodeURIComponent(item.image);
      const nameplate = document.createElement("div");
      nameplate.className = "nameplate";
      nameplate.textContent = item.name || "";
      float.appendChild(image);
      pop.appendChild(halo);
      pop.appendChild(float);
      pop.appendChild(nameplate);
      piece.appendChild(pop);
      reveal.appendChild(piece);
      placeItem(item);
      const appear = function () {

        if (shownItemKey === itemKey) {
          // let the browser lay it out small first, so it grows into place
          requestAnimationFrame(function () {
            reveal.classList.add("visible");
          });
        }
      };

      if (image.complete) {
        appear();
      } else {
        image.onload = appear;
        image.onerror = appear;
      }
    };

    // one item replacing another: fade the old one out first
    if (reveal.classList.contains("visible")) {
      reveal.classList.remove("visible");
      setTimeout(function () {

        if (shownItemKey === itemKey) {
          build();
        }
      }, 450);
      return;
    }

    build();
  }

  function swapPicture(state, images) {
    const nextLayer = 1 - activeLayer;
    const target = layers[nextLayer];
    target.innerHTML = "";
    target.classList.toggle("single", images.length === 1);

    images.forEach(function (imageName) {
      const image = document.createElement("img");
      image.src = "/img/" + encodeURIComponent(state.campaign || "") + "/" + encodeURIComponent(imageName);
      image.alt = "";
      target.appendChild(image);
    });

    const reveal = function () {
      layers[activeLayer].classList.remove("visible");
      target.classList.add("visible");
      activeLayer = nextLayer;
    };

    const pending = [...target.querySelectorAll("img")].map(function (image) {
      return new Promise(function (resolve) {

        if (image.complete) {
          resolve();
          return;
        }

        image.onload = resolve;
        image.onerror = resolve;
      });
    });

    Promise.all(pending).then(reveal);
  }

  function showPeople(people, state) {
    const keep = new Set(people.map(function (person) {
      return person.image;
    }));

    [...stage.querySelectorAll(".person")].forEach(function (element) {

      if (!keep.has(element.dataset.image)) {
        element.classList.remove("visible");
        element.dataset.image = "";
        setTimeout(function () {
          element.remove();
        }, 800);
      }
    });

    people.forEach(function (person, index) {
      let element = [...stage.querySelectorAll(".person")].find(function (candidate) {
        return candidate.dataset.image === person.image;
      });

      if (!element) {
        element = document.createElement("div");
        element.className = "person";
        element.dataset.image = person.image;
        const image = document.createElement("img");
        image.alt = "";
        image.src = "/cutout/" + encodeURIComponent(state.campaign || "") + "/" + encodeURIComponent(person.image);
        const nameplate = document.createElement("div");
        nameplate.className = "nameplate";
        nameplate.textContent = person.name;
        element.appendChild(image);
        element.appendChild(nameplate);
        stage.appendChild(element);
        image.onload = function () {
          element.classList.add("visible");
        };
      }

      const place = placement(person, index, people.length);
      const image = element.querySelector("img");
      element.style.left = place.left + "%";
      element.style.bottom = place.bottom + "%";
      element.style.height = (88 * place.scale) + "vh";
      element.style.zIndex = String(100 - Math.round(place.bottom));
      image.style.maxHeight = (88 * place.scale) + "vh";
      image.style.maxWidth = (46 * place.scale) + "vw";
      image.style.transform = place.flip ? "scaleX(-1)" : "";
      element.style.setProperty("--sink", Math.max(0, -place.bottom) + "vh");
    });

    stage.classList.toggle("occupied", people.length > 0);
    document.body.classList.toggle("staged", Boolean(state && state.fill) || people.length > 0 || Boolean(state && state.fx && state.fx.length));
    stage.classList.toggle("names", Boolean(state && state.caption));
  }



  document.addEventListener("click", function () {
    sounds.unlock();

    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });

  document.addEventListener("mousemove", function () {
    document.body.classList.add("show-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () {
      document.body.classList.remove("show-cursor");
    }, 1500);
  });
})();
</script>
</body>
</html>
